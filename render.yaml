services:
  - type: web
    name: freilesen-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://pirajenk.github.io
