services:
  freilesen-api:
    build: .
    container_name: freilesen-api
    restart: unless-stopped
    # Keep the backend off the public interface. Configure the NAS reverse
    # proxy to forward HTTPS requests to this loopback-only endpoint.
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    # Current NAS dashboard reports only 1.8 GB available; leave headroom for
    # the owner's existing services and keep this service modest for a beta.
    mem_limit: 768m
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
